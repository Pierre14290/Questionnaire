<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELECTROPARK statement</title>
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --text:#1f2430; --muted:#6b7385; --accent:#3b5bdb; --border:#d6dbe7; --ok:#2b8a3e; --err:#c92a2a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); padding:24px 16px; }
    .card { max-width:560px; margin:0 auto; background:var(--card); border-radius:14px; padding:28px; box-shadow:0 4px 18px rgba(0,0,0,.07); }
    h1 { margin:0 0 6px; font-size:1.5rem; }
    p.intro { margin:0 0 22px; color:var(--muted); }
    label, legend { display:block; font-weight:600; margin:18px 0 6px; padding:0; }
    input[type=text], input[type=email], input[type=number], select, textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font:inherit; background:#fff; }
    input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:1px; }
    button { margin-top:24px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #message { margin-top:16px; padding:12px; border-radius:8px; display:none; }
    #message.ok { display:block; background:#ebfbee; color:var(--ok); }
    #message.err { display:block; background:#fff5f5; color:var(--err); }
    .hidden { position:absolute; left:-9999px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>ELECTROPARK statement</h1>
    <p class="intro">Hour-by-hour statement</p>

    <form id="formulaire">
      <label for="entity">Name *</label>
      <input type="text" id="entity" name="entity" required maxlength="100" autocomplete="off" value="Terminal 1">

      <label for="email">E-mail address *</label>
      <input type="email" id="email" name="email" required maxlength="150" autocomplete="email" value="terminal1@electropark.ca">

      <label for="occupied_equipped">Number of parking spaces equipped with a charging station that are currently occupied *</label>
      <input type="number" id="occupied_equipped" name="occupied_equipped" required min="0" step="1" inputmode="numeric" autocomplete="off">

      <label for="occupied_not_equipped">Number of parking spaces not equipped with a charging station that are currently occupied *</label>
      <input type="number" id="occupied_not_equipped" name="occupied_not_equipped" required min="0" step="1" inputmode="numeric" autocomplete="off">

      <label for="energy_produced_kwh">Energy produced on-site (kWh) *</label>
      <input type="number" id="energy_produced_kwh" name="energy_produced_kwh" required min="0" step="any" inputmode="decimal" autocomplete="off">

      <label for="energy_consumed_kwh">Energy consumed on-site (kWh) *</label>
      <input type="number" id="energy_consumed_kwh" name="energy_consumed_kwh" required min="0" step="any" inputmode="decimal" autocomplete="off">

      <label for="max_import_power_kw">Maximum power imported from the grid (kW) *</label>
      <input type="number" id="max_import_power_kw" name="max_import_power_kw" required min="0" step="any" inputmode="decimal" autocomplete="off">

      <!-- Honeypot field (anti-bot): must stay empty -->
      <input type="text" name="site_web" id="site_web" class="hidden" tabindex="-1" autocomplete="off" aria-hidden="true">

      <button type="submit" id="envoyer">Send</button>
      <div id="message" role="status"></div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://mmcjzklgqxyeaynlkipk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fVnPRQt3WVGELk7jsNRZQg_qslMKMbS";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const form = document.getElementById("formulaire");
    const bouton = document.getElementById("envoyer");
    const message = document.getElementById("message");

    function afficher(texte, type) {
      message.textContent = texte;
      message.className = type;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      message.className = "";

      // Anti-bot
      if (form.site_web.value !== "") return;

      const entity = form.entity.value.trim();
      const email = form.email.value.trim();

      const occupied_equipped = form.occupied_equipped.valueAsNumber;
      const occupied_not_equipped = form.occupied_not_equipped.valueAsNumber;
      const energy_produced_kwh = form.energy_produced_kwh.valueAsNumber;
      const energy_consumed_kwh = form.energy_consumed_kwh.valueAsNumber;
      const max_import_power_kw = form.max_import_power_kw.valueAsNumber;

      if (!entity || !email) {
        afficher("Please fill in all required fields (*).", "err");
        return;
      }
      if (!Number.isInteger(occupied_equipped) || !Number.isInteger(occupied_not_equipped)
          || occupied_equipped < 0 || occupied_not_equipped < 0) {
        afficher("Parking space counts must be whole numbers (0 or more).", "err");
        return;
      }
      if (![energy_produced_kwh, energy_consumed_kwh, max_import_power_kw].every(v => Number.isFinite(v) && v >= 0)) {
        afficher("Energy and power values must be numbers (0 or more).", "err");
        return;
      }

      bouton.disabled = true;
      bouton.textContent = "Sending…";

      const { error } = await client.from("releves").insert({
        entity,
        email,
        occupied_equipped,
        occupied_not_equipped,
        energy_produced_kwh,
        energy_consumed_kwh,
        max_import_power_kw
      });

      bouton.disabled = false;
      bouton.textContent = "Send";

      if (error) {
        console.error(error);
        afficher("An error occurred. Please try again.", "err");
      } else {
        form.reset(); // name and e-mail go back to their default values, numbers are cleared
        afficher("Thank you! Your statement has been recorded.", "ok");
      }
    });
  </script>
</body>
</html>
