<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questionnaire</title>
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --text:#1f2430; --muted:#6b7385; --accent:#3b5bdb; --border:#d6dbe7; --ok:#2b8a3e; --err:#c92a2a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); padding:24px 16px; }
    .card { max-width:560px; margin:0 auto; background:var(--card); border-radius:14px; padding:28px; box-shadow:0 4px 18px rgba(0,0,0,.07); }
    h1 { margin:0 0 6px; font-size:1.5rem; }
    p.intro { margin:0 0 22px; color:var(--muted); }
    label, legend { display:block; font-weight:600; margin:18px 0 6px; padding:0; }
    input[type=text], input[type=email], select, textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font:inherit; background:#fff; }
    input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:1px; }
    textarea { min-height:100px; resize:vertical; }
    fieldset { border:0; padding:0; margin:0; }
    .rating { display:flex; gap:14px; flex-wrap:wrap; }
    .rating label { font-weight:400; margin:0; display:flex; align-items:center; gap:6px; }
    button { margin-top:24px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #message { margin-top:16px; padding:12px; border-radius:8px; display:none; }
    #message.ok { display:block; background:#ebfbee; color:var(--ok); }
    #message.err { display:block; background:#fff5f5; color:var(--err); }
    .hidden { position:absolute; left:-9999px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Votre avis nous intéresse</h1>
    <p class="intro">Ce questionnaire prend moins d'une minute. Merci d'avance !</p>

    <form id="formulaire" novalidate>
      <label for="nom">Nom *</label>
      <input type="text" id="nom" name="nom" required maxlength="100" autocomplete="name">

      <label for="email">Adresse e-mail *</label>
      <input type="email" id="email" name="email" required maxlength="150" autocomplete="email">

      <label for="source">Comment avez-vous connu ce questionnaire ?</label>
      <select id="source" name="source">
        <option value="">— Choisir —</option>
        <option>Un ami</option>
        <option>Réseaux sociaux</option>
        <option>Moteur de recherche</option>
        <option>Autre</option>
      </select>

      <label for="date_choisie">Date souhaitée</label>
      <input type="date" id="date_choisie" name="date_choisie">

      <fieldset>
        <legend>Satisfaction globale *</legend>
        <div class="rating">
          <label><input type="radio" name="satisfaction" value="1" required> 1</label>
          <label><input type="radio" name="satisfaction" value="2"> 2</label>
          <label><input type="radio" name="satisfaction" value="3"> 3</label>
          <label><input type="radio" name="satisfaction" value="4"> 4</label>
          <label><input type="radio" name="satisfaction" value="5"> 5</label>
        </div>
      </fieldset>

      <label for="commentaire">Commentaire</label>
      <textarea id="commentaire" name="commentaire" maxlength="2000"></textarea>

      <!-- Champ piège anti-robots : doit rester vide -->
      <input type="text" name="site_web" id="site_web" class="hidden" tabindex="-1" autocomplete="off" aria-hidden="true">

      <button type="submit" id="envoyer">Envoyer mes réponses</button>
      <div id="message" role="status"></div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ====== À REMPLACER par les valeurs de VOTRE projet Supabase ======
    const SUPABASE_URL = "https://mmcjzklgqxyeaynlkipk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fVnPRQt3WVGELk7jsNRZQg_qslMKMbS";
    // ==================================================================

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const form = document.getElementById("formulaire");
    const bouton = document.getElementById("envoyer");
    const message = document.getElementById("message");

    function afficher(texte, type) {
      message.textContent = texte;
      message.className = type;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      message.className = "";

      // Anti-robots
      if (form.site_web.value !== "") return;

      const nom = form.nom.value.trim();
      const email = form.email.value.trim();
      const satisfaction = form.satisfaction.value;

      if (!nom || !email || !satisfaction) {
        afficher("Merci de remplir tous les champs obligatoires (*).", "err");
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        afficher("L'adresse e-mail n'est pas valide.", "err");
        return;
      }

      bouton.disabled = true;
      bouton.textContent = "Envoi en cours…";

      const { error } = await client.from("reponses").insert({
        nom,
        email,
        source: form.source.value || null,
        date_choisie: form.date_choisie.value || null,
        satisfaction: Number(satisfaction),
        commentaire: form.commentaire.value.trim() || null
      });

      if (error) {
        console.error(error);
        afficher("Une erreur est survenue. Merci de réessayer.", "err");
        bouton.disabled = false;
        bouton.textContent = "Envoyer mes réponses";
      } else {
        form.reset();
        form.style.display = "none";
        afficher("Merci ! Vos réponses ont bien été enregistrées.", "ok");
      }
    });
  </script>
</body>
</html>
